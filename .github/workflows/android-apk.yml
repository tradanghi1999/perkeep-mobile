name: android-apk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # v4 bo package "tools" (da bi go khoi Android SDK repo) -> mac dinh chi con platform-tools.
      # v3 voi mac dinh cu se fail: "Failed to find package 'tools'".
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - run: bun install
      - run: bun run build

      - name: Capacitor sync (nạp plugin pk-upload)
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
          bunx cap sync android
          echo "--- plugin đã nạp (capacitor.settings.gradle) ---"
          cat android/capacitor.settings.gradle
          echo "--- quyền trong manifest app ---"
          grep -E "FOREGROUND_SERVICE|POST_NOTIFICATIONS|usesCleartextTraffic" android/app/src/main/AndroidManifest.xml || true
          # Cho phep HTTP thuong (Perkeep LAN khong co HTTPS)
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pk-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
