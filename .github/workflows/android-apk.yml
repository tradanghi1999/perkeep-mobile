name: android-apk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # v4 bo package "tools" (da bi go khoi Android SDK repo) -> mac dinh chi con platform-tools.
      # v3 voi mac dinh cu se fail: "Failed to find package 'tools'".
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - run: bun install
      - run: bun run build

      - name: Capacitor sync (nạp plugin pk-upload)
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
          bunx cap sync android
          echo "--- plugin đã nạp ---"
          grep -E "include ':" android/capacitor.settings.gradle || true
          # Cho phep HTTP thuong (Perkeep LAN khong co HTTPS)
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Kiểm tra manifest merge + APK
        run: |
          MAN=$(find android/app/build/intermediates -name AndroidManifest.xml -path "*merged_manifest*" | head -1)
          echo "merged manifest: $MAN"
          echo "--- quyền / foregroundServiceType / provider ---"
          grep -Eo 'android.permission.[A-Z_]+|foregroundServiceType="[A-Za-z]+"|usesCleartextTraffic="true"|androidx.core.content.FileProvider' "$MAN" | sort -u
          echo "--- APK ---"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: pk-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
