name: android-apk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - run: bun install
      - run: bun run build
      - name: Capacitor sync (nạp plugin pk-upload)
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
          bunx cap sync android
          echo "--- plugin đã nạp ---"
          cat android/capacitor.settings.gradle
          # Cho phep HTTP thuong (Perkeep LAN khong co HTTPS)
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pk-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
